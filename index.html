
            <!DOCTYPE1. html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSnippet Vault & DevDocs</title>
    <link rel="stylesheet" href="документация.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CodeSnippet Vault</h1>
            <p>Хранилище шпаргалок и официальная документация DevDocs</p>
        </header>

        <!-- Поиск -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по названию или языку...">
        </div>

        <!-- Вкладки категорий -->
        <div class="tabs" id="tabButtons">
            <button class="tab-btn active" data-lang="ALL">ALL</button>
            <button class="tab-btn" data-lang="JS">JS</button>
            <button class="tab-btn" data-lang="HTML">HTML</button>
            <button class="tab-btn" data-lang="CSS">CSS</button>
            <button class="tab-btn" data-lang="PYTHON">PYTHON</button>
            <button class="tab-btn" data-lang="TYPESCRIPT">TYPESCRIPT</button>
            <button class="tab-btn" data-lang="C++">C++</button>
        </div>

        <!-- Контейнер для карточек -->
        <main id="snippetsContainer" class="snippets-grid"></main>

        <!-- Форма добавления своей шпаргалки -->
        <section class="form-section">
            <h2>Добавить свою шпаргалку</h2>
            <form id="addForm">
                <input type="text" id="newTitle" placeholder="Название шпаргалки" required>
                <select id="newLang" required>
                    <option value="JS">JavaScript</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="PYTHON">Python</option>
                    <option value="TYPESCRIPT">TypeScript</option>
                    <option value="C++">C++</option>
                </select>
                <input type="text" id="newDesc" placeholder="Краткое описание" required>
                <textarea id="newCode" placeholder="Вставьте ваш код..." rows="5"></textarea>
                <button type="submit" class="submit-btn">Сохранить в vault</button>
            </form>
        </section>
    </div>

    <script src="документация.js"></script>
</body>
</html>
